<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <style>
        :root { --bg-color: #0f172a; --text-color: #e2e8f0; --accent-color: #38bdf8; --card-bg: #1e293b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        header { text-align: center; padding: 3rem 0; border-bottom: 1px solid #334155; }
        .header-visuals { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 1.5rem; }
        .logo { position: absolute; left: 10px; top: 80%; transform: translateY(-50%); max-width: 200px; height: auto; z-index: 10; }
        .banner { max-width: auto; max-height: auto; width: auto; object-fit: cover; }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--accent-color); }
        .tagline { font-size: 1.2rem; color: #94a3b8; }
        section { padding: 3rem 0; }
        h2 { color: var(--accent-color); border-left: 4px solid var(--accent-color); padding-left: 1rem; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .service-card { background-color: var(--card-bg); padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; }
        .service-card h3 { margin-top: 0; color: #f8fafc; }
        .btn { display: inline-block; background-color: var(--accent-color); color: var(--bg-color); padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 1rem; margin-right: 0.5rem; transition: background 0.3s; }
        .btn:hover { background-color: #0ea5e9; }
        .btn-secondary { background-color: #10b981; }
        .btn-secondary:hover { background-color: #059669; }
        footer { text-align: center; padding: 2rem 0; color: #64748b; font-size: 0.9rem; border-top: 1px solid #334155; margin-top: 2rem; }
        @media (max-width: 600px) { .header-visuals { flex-direction: column; gap: 1rem; } .logo { position: static; max-height: 50px; } }
        
        /* Blog Post Specific Styles */
        .back-link { display: inline-block; color: var(--accent-color); text-decoration: none; margin-bottom: 1rem; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
        .lang-switch { display: inline-block; color: var(--accent-color); text-decoration: none; margin-bottom: 2rem; padding: 0.5rem 1rem; border: 1px solid var(--accent-color); border-radius: 4px; font-size: 0.9rem; }
        .lang-switch:hover { background-color: var(--accent-color); color: var(--bg-color); }
        .post-header { border-bottom: 1px solid #334155; padding-bottom: 1.5rem; margin-bottom: 2rem; }
        .post-date { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .post-content h3 { color: var(--accent-color); margin-top: 2rem; margin-bottom: 1rem; font-size: 1.3rem; }
        .post-content p { margin-bottom: 1.5rem; font-size: 1.1rem; }
        .highlight-box { background-color: var(--card-bg); border-left: 4px solid #ef4444; padding: 1.5rem; margin: 2rem 0; border-radius: 0 8px 8px 0; font-size: 1.1rem; }
        .source-link { color: #94a3b8; font-size: 0.9rem; margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #334155; }
        .source-link a { color: var(--accent-color); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-visuals">
                <img src="/images/cybersopho.png" alt="CyberSopho Logo" class="logo">
                <img src="/images/banner.jpg" alt="CyberSopho Banner" class="banner">
            </div>
            <h1>{{ site.title }}</h1>
            <p class="tagline">Cybersecurity Consulting & Threat Intelligence</p>
            <a href="/" class="btn">Home</a>
            <a href="/#contact" class="btn">Get in Touch</a>
        </header>

        {{ content }}

        <footer>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                <a href="https://www.linkedin.com/company/cybersopho" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; gap: 0.5rem; color: var(--accent-color); text-decoration: none; font-weight: bold; transition: opacity 0.3s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                    Follow CyberSopho on LinkedIn
                </a>
                <p style="color: #64748b; font-size: 0.9rem; margin: 0;">&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
            </div>
        </footer>
    </div>
</body>
</html>
